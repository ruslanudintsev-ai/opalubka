name: P1b Astro preview quality

on:
  pull_request:
    paths:
      - modern/**
      - .github/workflows/p1b-astro-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: modern
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate lock for verification
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Typecheck Astro and TypeScript
        run: npm run check
      - name: Unit test domain
        run: npm test
      - name: Build static output
        run: npm run build
      - name: Validate built static page
        run: |
          test -s dist/index.html
          node -e 'const fs=require("node:fs");const s=fs.readFileSync("dist/index.html","utf8");if(!s.includes("DEMO")||s.includes("Заявка отправлена")||s.includes("image.qwenlm.ai"))process.exit(1);'
      - name: Print lock for initial tracked lockfile creation
        run: |
          node -e 'const fs=require("node:fs"),s=fs.readFileSync("package-lock.json","utf8");console.log("LOCK_BEGIN");for(let i=0;i<s.length;i+=3000)console.log("LOCK_CHUNK "+(i/3000)+" "+JSON.stringify(s.slice(i,i+3000)));console.log("LOCK_END");'
