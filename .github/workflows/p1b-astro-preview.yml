name: P1b Astro preview quality

on:
  pull_request:
    paths:
      - modern/**
      - .github/workflows/p1b-astro-preview.yml
  workflow_dispatch:

concurrency:
  group: p1b-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: modern
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert candidate checkout provenance
        run: |
          echo "Candidate source SHA: $SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Typecheck Astro and TypeScript
        run: npm run check
      - name: Unit test domain
        run: npm test
      - name: Build static output
        run: npm run build
      - name: Validate built static page
        run: |
          test -s dist/index.html
          node -e 'const fs=require("node:fs");const s=fs.readFileSync("dist/index.html","utf8");if(!s.includes("DEMO")||s.includes("Заявка отправлена")||s.includes("image.qwenlm.ai"))process.exit(1);'
      - name: Install browser engines and OS libraries
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Real browser, viewport, download and axe tests
        run: |
          npm run preview -- --port 4321 > /tmp/opalubka-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fs -o /dev/null http://127.0.0.1:4321/; then
              ready=1
              echo "PREVIEW_HTTP_READY on attempt $attempt"
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Preview failed to start:"
            cat /tmp/opalubka-preview.log
            exit 1
          fi
          npm run test:e2e

      - name: Save actual screenshot, trace and HTML QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1c-browser-evidence-${{ env.SOURCE_SHA }}
          path: |
            modern/test-results/
            modern/playwright-report/
          if-no-files-found: warn
          retention-days: 14
